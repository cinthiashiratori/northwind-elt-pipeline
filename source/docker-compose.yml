version: '3'

services:
  db:
    image: postgres:12
    environment:
      POSTGRES_DB: ${NORTHWIND_DB:?Set NORTHWIND_DB in source/.env}
      POSTGRES_USER: ${NORTHWIND_USER:?Set NORTHWIND_USER in source/.env}
      POSTGRES_PASSWORD: ${NORTHWIND_PASSWORD:?Set NORTHWIND_PASSWORD in source/.env}
    volumes:
      - ./dbdata:/var/lib/postgresql/data
      - ./data/northwind.sql:/docker-entrypoint-initdb.d/northwind.sql
    ports:
      - 5432:5432
